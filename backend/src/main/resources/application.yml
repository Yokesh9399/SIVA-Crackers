# SIVA Crackers backend configuration.
#
# SECURITY: secrets are NEVER written here. Every ${VAR} without a default is
# required and must be provided as an environment variable (see .env.example
# and README.md). The application refuses to start if one is missing.

spring:
  application:
    name: siva-crackers-backend

  # ---------- Image uploads (admin only, Phase 5) ----------
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
      file-size-threshold: 0

  # ---------- Database (MySQL 8) ----------
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: siva-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Load images / safety notes of many products in one query each (avoids N+1 queries)
        default_batch_fetch_size: 50
    show-sql: false

  # ---------- Schema migrations ----------
  flyway:
    enabled: true
    locations: classpath:db/migration   # demo data location is added in Phase 4.3 when APP_SEED_DEMO=true
    fail-on-missing-locations: false
    validate-on-migrate: true
    baseline-on-migrate: false

  mvc:
    problemdetails:
      enabled: false              # GlobalExceptionHandler produces the single ApiError format

  jackson:
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  compression:
    enabled: true
  error:
    # Never leak internal details in default error responses
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

# ---------- Application settings (validated by AppProperties) ----------
app:
  jwt:
    secret: ${JWT_SECRET}                         # required, at least 32 bytes
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  cookie:
    name: SIVA_SESSION
    secure: ${APP_COOKIE_SECURE:true}             # keep true outside local development
    same-site: ${APP_COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}     # empty = no cross-origin access (dev uses the Vite proxy)
  seed-demo: ${APP_SEED_DEMO:false}               # demo catalogue is off unless explicitly enabled
  bootstrap:
    owner-email: ${BOOTSTRAP_OWNER_EMAIL:}
    owner-password: ${BOOTSTRAP_OWNER_PASSWORD:}
  media:
    upload-dir: ${APP_UPLOAD_DIR:uploads}           # uploaded images (relative to the backend folder); git-ignored

# ---------- API documentation: off unless the dev profile is active ----------
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ---------- Logging: no SQL bind values, no request bodies, no secrets ----------
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.security: INFO
